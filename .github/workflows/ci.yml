name: Pipeline CI/CD LabDesk

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-validate:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: labdesk_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Instalar dependências (Backend)
        run: cd backend && npm install

      - name: Preparar Banco de Dados e Prisma
        run: |
          cd backend
          npx prisma generate
          npx prisma db push
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/labdesk_test

      - name: Testes Automatizados (Backend)
        run: cd backend && npm test
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/labdesk_test

      - name: Instalar dependências (Frontend)
        run: cd frontend && npm install

      - name: Build (Frontend)
        run: cd frontend && npm run build

      - name: Validação Docker Compose
        run: docker-compose config