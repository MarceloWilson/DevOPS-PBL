version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: labdesk
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://root:root@db:3306/labdesk
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push && node index.js"

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
